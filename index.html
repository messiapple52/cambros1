<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cam Bros Photography PRO</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b0b0b;
    color:white;
}

.hero{
    text-align:center;
    padding:70px 20px;
    background:linear-gradient(135deg,#111,#000);
}

button{
    padding:12px 16px;
    margin:6px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.primary{background:white;color:black;}
.dark{background:#333;color:white;}

.page{
    display:none;
    padding:25px;
    max-width:900px;
    margin:auto;
}

.card{
    background:#1c1c1c;
    padding:15px;
    border-radius:12px;
    margin:12px 0;
}

img{
    width:130px;
    margin:5px;
    border-radius:8px;
    cursor:pointer;
}

input,textarea{
    width:100%;
    padding:10px;
    margin:6px 0;
    border-radius:8px;
    border:none;
}

/* POPUP */
#popup{
    position:fixed;
    top:0;left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    display:none;
    justify-content:center;
    align-items:center;
}

.popupBox{
    background:#222;
    padding:20px;
    border-radius:12px;
    width:300px;
}
</style>
</head>

<body>

<!-- HOME -->
<div class="hero" id="home">
<h1>Cam Bros Photography</h1>

<button onclick="go('photos')">Our Photos</button>
<button onclick="go('events')">Events</button>
<button onclick="go('gallery')">Find My Photos</button>
<button onclick="go('book')">Book</button>
<button onclick="go('admin')">Admin</button>
</div>

<!-- OUR PHOTOS -->
<div class="page" id="photos">
<div class="card">
<h2>Our Photos</h2>
<p>Portfolio section (admin controlled later)</p>
<img src="https://picsum.photos/200/140?1">
<img src="https://picsum.photos/200/140?2">
<img src="https://picsum.photos/200/140?3">
<img src="https://picsum.photos/200/140?4">
</div>
<button onclick="back()">Back</button>
</div>

<!-- EVENTS -->
<div class="page" id="events">
<div class="card">
<h2>Upcoming Events</h2>
<ul id="eventList">
<li>No events yet</li>
</ul>
</div>
<button onclick="back()">Back</button>
</div>

<!-- GALLERY -->
<div class="page" id="gallery">
<div class="card">
<h2>Find My Photos</h2>

<input id="code" placeholder="Enter Gallery Code">
<button onclick="openGallery()">Open Gallery</button>

<div id="galleryView"></div>
</div>

<button onclick="back()">Back</button>
</div>

<!-- BOOK -->
<div class="page" id="book">
<div class="card">
<h2>Book a Shoot</h2>

<input id="bname" placeholder="Name">
<input id="bemail" placeholder="Email">
<input id="bphone" placeholder="Phone">

<button onclick="submitBooking()">Submit Booking</button>
<p id="msg"></p>
</div>
<button onclick="back()">Back</button>
</div>

<!-- ADMIN -->
<div class="page" id="admin">

<div class="card" id="loginBox">
<h2>Admin Login</h2>
<input id="pass" type="password">
<button onclick="login()">Login</button>
</div>

<div class="card" id="panel" style="display:none">

<h2>Admin Dashboard</h2>

<h3>Create Gallery Code</h3>
<input id="newCode">
<button onclick="createGallery()">Create</button>

<h3>Upload Photo</h3>
<input id="uploadCode">
<input type="file" id="file">
<button onclick="upload()">Upload</button>

<hr>

<h3>BOOKINGS</h3>
<div id="bookings"></div>

<h3>ORDERS</h3>
<div id="orders"></div>

</div>

<button onclick="logout()">Logout</button>
</div>

<!-- ORDER POPUP -->
<div id="popup">
<div class="popupBox">
<h3>Place Order</h3>

<input id="orderName" placeholder="Name">
<input id="orderEmail" placeholder="Email">
<input id="orderPhone" placeholder="Phone">

<button onclick="submitOrder()">Place Order</button>
<button onclick="closePopup()">Close</button>
</div>
</div>

<script>

/* NAV */
function go(p){
    document.getElementById("home").style.display="none";
    document.querySelectorAll(".page").forEach(x=>x.style.display="none");
    document.getElementById(p).style.display="block";
}

function back(){
    document.querySelectorAll(".page").forEach(x=>x.style.display="none");
    document.getElementById("home").style.display="block";
}

/* LOGIN */
function login(){
    if(pass.value==="Cambros2025"){
        loginBox.style.display="none";
        panel.style.display="block";
        loadAdmin();
    } else alert("Wrong password");
}

/* LOGOUT FIXED */
function logout(){
    panel.style.display="none";
    loginBox.style.display="block";

    pass.value="";
    back();
}

/* GALLERY */
function openGallery(){
    const code=code.value;
    let data=JSON.parse(localStorage.getItem(code));

    galleryView.innerHTML="";

    if(!data){galleryView.innerHTML="No photos";return;}

    data.forEach(img=>{
        let i=document.createElement("img");
        i.src=img;
        i.onclick=()=>openOrder(img);
        galleryView.appendChild(i);
    });
}

/* ORDER */
let selected="";

function openOrder(img){
    selected=img;
    popup.style.display="flex";
}

function closePopup(){
    popup.style.display="none";
}

function submitOrder(){
    let orders=JSON.parse(localStorage.getItem("orders"))||[];

    orders.push({
        name:orderName.value,
        email:orderEmail.value,
        phone:orderPhone.value,
        image:selected
    });

    localStorage.setItem("orders",JSON.stringify(orders));

    alert("Order placed");
    closePopup();
}

/* BOOKING */
function submitBooking(){
    let b=JSON.parse(localStorage.getItem("bookings"))||[];

    b.push({
        name:bname.value,
        email:bemail.value,
        phone:bphone.value
    });

    localStorage.setItem("bookings",JSON.stringify(b));

    msg.innerText="Booking sent";
}

/* ADMIN */
function loadAdmin(){
    let b=JSON.parse(localStorage.getItem("bookings"))||[];
    let o=JSON.parse(localStorage.getItem("orders"))||[];

    bookings.innerHTML=b.map(x=>`
    <div class="card">${x.name}<br>${x.email}<br>${x.phone}</div>
    `).join("");

    orders.innerHTML=o.map(x=>`
    <div class="card">${x.name}<br>${x.email}<br>${x.phone}<br>Image attached</div>
    `).join("");
}

/* GALLERY CREATE */
function createGallery(){
    localStorage.setItem(newCode.value,JSON.stringify([]));
    alert("Created");
}

/* UPLOAD */
function upload(){
    let file=document.getElementById("file").files[0];
    let code=document.getElementById("uploadCode").value;

    let r=new FileReader();

    r.onload=e=>{
        let d=JSON.parse(localStorage.getItem(code))||[];
        d.push(e.target.result);
        localStorage.setItem(code,JSON.stringify(d));
        alert("Uploaded");
    };

    r.readAsDataURL(file);
}

</script>

</body>
</html>
