<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cam Bros Photography</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0a0a0a;
    color:white;
}

.hero{
    padding:70px 20px;
    text-align:center;
    background:linear-gradient(135deg,#111,#000);
}

h1{margin:0;font-size:40px;}

button{
    padding:12px 16px;
    margin:6px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.primary{background:white;color:black;}
.dark{background:#333;color:white;}

.page{
    display:none;
    padding:25px;
    max-width:900px;
    margin:auto;
}

.card{
    background:#1b1b1b;
    padding:18px;
    border-radius:12px;
    margin:12px 0;
}

input,textarea{
    width:100%;
    padding:10px;
    margin:6px 0;
    border-radius:8px;
    border:none;
}

img{
    width:130px;
    margin:5px;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="hero" id="home">
<h1>Cam Bros Photography</h1>
<p>Sports • Events • Moments</p>

<button class="primary" onclick="go('gallery')">Find My Photos</button>
<button class="dark" onclick="go('photos')">Our Photos</button>
<button class="dark" onclick="go('events')">Events</button>
<button class="dark" onclick="go('book')">Book</button>
<button class="primary" onclick="go('admin')">Admin</button>
</div>

<!-- GALLERY -->
<div class="page" id="gallery">
<div class="card">
<h2>Find My Photos</h2>

<input id="code" placeholder="Enter code">
<button onclick="loadGallery()">Open Gallery</button>

<div id="galleryView"></div>
</div>

<button onclick="back()">Back</button>
</div>

<!-- PHOTOS -->
<div class="page" id="photos">
<div class="card">
<h2>Our Photos</h2>
<p>Portfolio section (admin controlled)</p>
</div>
<button onclick="back()">Back</button>
</div>

<!-- EVENTS -->
<div class="page" id="events">
<div class="card">
<h2>Events</h2>
<div id="eventList">No events yet</div>
</div>
<button onclick="back()">Back</button>
</div>

<!-- BOOKING -->
<div class="page" id="book">
<div class="card">
<h2>Book a Shoot</h2>

<input id="bname" placeholder="Name">
<input id="bemail" placeholder="Email">
<input id="bphone" placeholder="Phone">
<textarea id="bdetails" placeholder="Details"></textarea>

<button onclick="submitBooking()">Submit Booking</button>

<p id="msg"></p>
</div>

<button onclick="back()">Back</button>
</div>

<!-- ADMIN -->
<div class="page" id="admin">

<div class="card" id="loginBox">
<h2>Admin Login</h2>
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div class="card" id="panel" style="display:none">

<h2>Admin Panel</h2>

<h3>Create Gallery</h3>
<input id="newCode">
<button onclick="createGallery()">Create</button>

<h3>Upload Photo</h3>
<input id="uploadCode" placeholder="Gallery Code">
<input type="file" id="file">
<button onclick="upload()">Upload</button>

<h3>Bookings</h3>
<div id="bookings"></div>

<h3>Orders</h3>
<div id="orders"></div>

</div>

<button onclick="logout()">Logout</button>
</div>

<script>

/* =======================
   SAFE NAVIGATION SYSTEM
======================= */

function go(page){
    document.getElementById("home").style.display="none";
    document.querySelectorAll(".page").forEach(p=>p.style.display="none");
    document.getElementById(page).style.display="block";
}

function back(){
    document.querySelectorAll(".page").forEach(p=>p.style.display="none");
    document.getElementById("home").style.display="block";
}

/* =======================
   ADMIN LOGIN (FIXED)
======================= */

function login(){
    const pass = document.getElementById("pass").value;

    if(pass === "Cambros2025"){
        document.getElementById("loginBox").style.display="none";
        document.getElementById("panel").style.display="block";
        loadAdmin();
        alert("Logged in");
    } else {
        alert("Wrong password");
    }
}

/* AUTO LOGOUT ON LEAVE */
document.addEventListener("visibilitychange",()=>{
    if(document.hidden){
        logout();
    }
});

function logout(){
    document.getElementById("panel").style.display="none";
    document.getElementById("loginBox").style.display="block";
}

/* =======================
   BOOKING (ALWAYS WORKS)
======================= */

function submitBooking(){

    const name = document.getElementById("bname").value;
    const email = document.getElementById("bemail").value;
    const phone = document.getElementById("bphone").value;

    if(!name || !email || !phone){
        document.getElementById("msg").innerText="Fill all fields";
        return;
    }

    document.getElementById("msg").innerText="Booking sent!";
}

/* =======================
   GALLERY (SAFE LOAD)
======================= */

function loadGallery(){

    const code = document.getElementById("code").value;

    let data = JSON.parse(localStorage.getItem(code));

    const box = document.getElementById("galleryView");
    box.innerHTML = "";

    if(!data || data.length === 0){
        box.innerHTML="No photos found";
        return;
    }

    data.forEach(img=>{
        let i=document.createElement("img");
        i.src=img;
        box.appendChild(i);
    });
}

/* =======================
   ADMIN FUNCTIONS
======================= */

function createGallery(){
    const code=document.getElementById("newCode").value;
    localStorage.setItem(code, JSON.stringify([]));
    alert("Gallery created: " + code);
}

function upload(){

    const file=document.getElementById("file").files[0];
    const code=document.getElementById("uploadCode").value;

    if(!file || !code){
        alert("Missing file or code");
        return;
    }

    let reader = new FileReader();

    reader.onload = function(e){

        let arr = JSON.parse(localStorage.getItem(code)) || [];

        arr.push(e.target.result);

        localStorage.setItem(code, JSON.stringify(arr));

        alert("Uploaded to " + code);
    };

    reader.readAsDataURL(file);
}

/* LOAD ADMIN DATA */
function loadAdmin(){
    document.getElementById("bookings").innerHTML="No bookings (demo)";
    document.getElementById("orders").innerHTML="No orders (demo)";
}

</script>

</body>
</html>
