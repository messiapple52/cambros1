<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cam Bros Photography PRO</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b0b0b;
    color:white;
}

.hero{
    text-align:center;
    padding:70px 20px;
    background:linear-gradient(135deg,#111,#000);
}

button{
    padding:12px 16px;
    margin:6px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.primary{background:white;color:black;}
.dark{background:#333;color:white;}

.page{
    display:none;
    padding:25px;
    max-width:900px;
    margin:auto;
}

.card{
    background:#1c1c1c;
    padding:15px;
    border-radius:12px;
    margin:12px 0;
}

img{
    width:130px;
    margin:5px;
    border-radius:8px;
    cursor:pointer;
}

input,textarea{
    width:100%;
    padding:10px;
    margin:6px 0;
    border-radius:8px;
    border:none;
}

/* POPUP ORDER */
#popup{
    position:fixed;
    top:0;left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    display:none;
    justify-content:center;
    align-items:center;
}

.popupBox{
    background:#222;
    padding:20px;
    border-radius:12px;
    width:300px;
}
</style>
</head>

<body>

<!-- HOME -->
<div class="hero" id="home">
<h1>Cam Bros Photography</h1>

<button onclick="go('gallery')">Find My Photos</button>
<button onclick="go('book')">Book</button>
<button onclick="go('admin')">Admin</button>
</div>

<!-- GALLERY -->
<div class="page" id="gallery">
<div class="card">
<h2>Find My Photos</h2>

<input id="code" placeholder="Enter Gallery Code">
<button onclick="openGallery()">Open Gallery</button>

<div id="galleryView"></div>
</div>

<button onclick="back()">Back</button>
</div>

<!-- BOOKING -->
<div class="page" id="book">
<div class="card">
<h2>Book a Shoot</h2>

<input id="bname" placeholder="Name">
<input id="bemail" placeholder="Email">
<input id="bphone" placeholder="Phone">

<button onclick="submitBooking()">Submit Booking</button>

<p id="msg"></p>
</div>
<button onclick="back()">Back</button>
</div>

<!-- ADMIN -->
<div class="page" id="admin">

<div class="card" id="loginBox">
<h2>Admin Login</h2>
<p>Enter password to access dashboard</p>
<input id="pass" type="password">
<button onclick="login()">Login</button>
</div>

<div class="card" id="panel" style="display:none">

<h2>ADMIN DASHBOARD</h2>
<p>Welcome. Manage galleries, bookings, and orders.</p>

<h3>Create Gallery Code</h3>
<input id="newCode">
<button onclick="createGallery()">Create</button>

<h3>Upload Photo to Code</h3>
<input id="uploadCode">
<input type="file" id="file">
<button onclick="upload()">Upload</button>

<hr>

<h3>BOOKINGS</h3>
<div id="bookings"></div>

<h3>ORDERS</h3>
<div id="orders"></div>

</div>

<button onclick="logout()">Logout</button>
</div>

<!-- ORDER POPUP -->
<div id="popup">
<div class="popupBox">
<h3>Place Order</h3>

<input id="orderName" placeholder="Name">
<input id="orderEmail" placeholder="Email">
<input id="orderPhone" placeholder="Phone">

<button onclick="submitOrder()">Place Order</button>
<button onclick="closePopup()">Close</button>
</div>
</div>

<script>

/* =========================
NAVIGATION (FIXED)
========================= */

function go(page){
    document.getElementById("home").style.display="none";
    document.querySelectorAll(".page").forEach(p=>p.style.display="none");
    document.getElementById(page).style.display="block";
}

function back(){
    document.querySelectorAll(".page").forEach(p=>p.style.display="none");
    document.getElementById("home").style.display="block";
}

/* =========================
ADMIN LOGIN
========================= */

function login(){
    if(document.getElementById("pass").value==="Cambros2025"){
        document.getElementById("loginBox").style.display="none";
        document.getElementById("panel").style.display="block";
        loadAdmin();
    } else alert("Wrong password");
}

/* FULL LOGOUT FIX */
function logout(){

    // reset admin UI
    document.getElementById("panel").style.display="none";
    document.getElementById("loginBox").style.display="block";

    // clear inputs
    document.getElementById("pass").value="";

    // go home
    back();
}

/* =========================
GALLERY SYSTEM
========================= */

function openGallery(){

    const code = document.getElementById("code").value;
    const data = JSON.parse(localStorage.getItem(code));

    const box = document.getElementById("galleryView");
    box.innerHTML="";

    if(!data || data.length===0){
        box.innerHTML="No photos found. Make sure code exists and press OPEN.";
        return;
    }

    data.forEach(img=>{
        let i=document.createElement("img");
        i.src=img;

        // CLICK PHOTO → OPEN ORDER POPUP
        i.onclick = ()=>openOrderPopup(img);

        box.appendChild(i);
    });
}

/* =========================
ORDER SYSTEM (PHOTO CLICK)
========================= */

let selectedImage = "";

function openOrderPopup(img){
    selectedImage = img;
    document.getElementById("popup").style.display="flex";
}

function closePopup(){
    document.getElementById("popup").style.display="none";
}

function submitOrder(){

    const name=document.getElementById("orderName").value;
    const email=document.getElementById("orderEmail").value;
    const phone=document.getElementById("orderPhone").value;

    if(!name || !email || !phone){
        alert("Fill all fields");
        return;
    }

    let orders = JSON.parse(localStorage.getItem("orders")) || [];

    orders.push({
        name,email,phone,image:selectedImage
    });

    localStorage.setItem("orders",JSON.stringify(orders));

    alert("Order placed!");

    closePopup();
}

/* =========================
BOOKINGS
========================= */

function submitBooking(){

    const name=bname.value;
    const email=bemail.value;
    const phone=bphone.value;

    let bookings = JSON.parse(localStorage.getItem("bookings")) || [];

    bookings.push({name,email,phone});

    localStorage.setItem("bookings",JSON.stringify(bookings));

    msg.innerText="Booking submitted!";
}

/* =========================
ADMIN DATA
========================= */

function loadAdmin(){

    let bookings = JSON.parse(localStorage.getItem("bookings")) || [];
    let orders = JSON.parse(localStorage.getItem("orders")) || [];

    document.getElementById("bookings").innerHTML =
    bookings.map(b=>
        `<div class="card">
        ${b.name}<br>${b.email}<br>${b.phone}
        </div>`
    ).join("");

    document.getElementById("orders").innerHTML =
    orders.map(o=>
        `<div class="card">
        ${o.name}<br>${o.email}<br>${o.phone}<br>
        <small>Image attached</small>
        </div>`
    ).join("");
}

/* =========================
CREATE / UPLOAD (LOCAL DEMO)
========================= */

function createGallery(){
    const code = newCode.value;
    localStorage.setItem(code,JSON.stringify([]));
    alert("Gallery created: "+code);
}

function upload(){

    const file = document.getElementById("file").files[0];
    const code = document.getElementById("uploadCode").value;

    if(!file || !code){
        alert("Missing file or code");
        return;
    }

    let reader = new FileReader();

    reader.onload = function(e){

        let data = JSON.parse(localStorage.getItem(code)) || [];
        data.push(e.target.result);
        localStorage.setItem(code,JSON.stringify(data));

        alert("Uploaded to " + code);
    };

    reader.readAsDataURL(file);
}

</script>

</body>
</html>
